<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h2 onmouseover="changcolor(this)" onmouseout="resetcolor(this)">hover over me!</h2> 
 <script>
    function changcolor(element){
        element.style.color="red";
    }

    
     function resetcolor(element){
        element.style.color="black";
    }
 </script>
</body>
</html>
