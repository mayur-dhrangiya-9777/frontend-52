<body>
    <h2>example  of script</h2>
    <h3>example of addition,subtraction,multipication,division</h3>

    <script>
           
    var num1 = prompt("enter your number",1);
    var num2 = prompt("enter your number",2);
    
    num1 = parseInt(num1);
    num2 = parseInt(num2);  

       var addition=num1+num2 ;
       var subtraction=num1-num2 ; 
       var multipication=num1*num2 ;
       var division=num1/num2 ;


       alert("addition"+addition);
       alert("subtrction"+subtraction);
       alert("multipication"+multipication);
       alert("division"+division);

    

    </script>
</body>
