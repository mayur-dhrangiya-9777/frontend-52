<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function convertAndRound(str) {
            const num = Number(str);
            if (isNaN(num)) return NaN;
            return Number(num.toFixed(2));
        }
    </script>
</body>

</html>
