    <script>
        // Create a function compareValues(a, b) that returns an object showing results of ==, ===, !=, !== for all comparison cases including strings, numbers, booleans, null/undefined, and NaN
        function compareValues(a, b) {
  return {
    doubleEquals: a == b,
    tripleEquals: a === b,
    notDoubleEquals: a != b,
    notTripleEquals: a !== b,
    values: {
      a: a,
      b: b
    },
    types: {
      a: typeof a,
      b: typeof b
    }
  };
}
    </script>
