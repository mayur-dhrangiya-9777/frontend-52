<body>

    <h2>excsize 7</h2>
    <script>
        // Write a named function greet(name = 'Guest') with a default parameter that returns a greeting string. Call it with and without an argument.
        function greet(name = 'Guest') {
            return `Hello, ${name}!`;
        }

        // Call without argument (uses default)
        console.log(greet());          // Hello, Guest!

        // Call with argument
        console.log(greet("Alice"));   // Hello, Alice!
    </script>
</body>
