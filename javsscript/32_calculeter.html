<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background:linear-gradient(135deg,#667eea,#764ba2);
            font-family: Arial, Helvetica, sans-serif;
        }
        .calculator{
            background: #1b1b1b;
            padding: 20px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }
        #display{
            width:100%;
            height: 50px;
            margin-bottom: 15px;
            font-size: 20px;
            text-align: right;
            padding: 10px;
            border-radius: 10px;
            border:1px solid #ccc
        }
        .buttons{
            display: grid;
            grid-template-columns: repeat(4,60px);
            gap:10px;
        }
        button{
            height: 50px;
            font-size-adjust: 18px;
            border:none;
            border-radius:10px;
            cursor: pointer;
            background: #ea6666;
            color:rgb(255, 255, 255);
            transition: 0.3s;
        }
        button:hover{
            background:#d85ac3;
        }
        .equal{
            background: #85a728;
        }
        .clear{
            background:#35dcce;
        }
    </style>
</head>
<body>
    <div class="calculator">
    <input type="text" id="display" disabled>

    <br>
    <button class="btn" onclick="append('7')">7</button>
    <button class="btn" onclick="append('8')">8</button>
    <button class="btn" onclick="append('9')">9</button>
    <button class="operator" onclick="append('/')">/</button>

    <br>
    <button class="btn" onclick="append('4')">4</button>
    <button class="btn" onclick="append('5')">5</button>
    <button class="btn" onclick="append('6')">6</button>
    <button class="operator" onclick="append('*')">*</button>

    <br>
    <button class="btn" onclick="append('1')">1</button>
    <button class="btn" onclick="append('2')">2</button>
    <button class="btn" onclick="append('3')">3</button>
    <button class="operator" onclick="append('-')">-</button>

    <br>
    <button class="btn" onclick="append('0')">0</button>
    <button class="btn" onclick="append('.')">.</button>
    <button class="equal" onclick="calculate()">=</button>
    <button class="operator" onclick="append('+')">+</button>

    <br>
    <button class="clear" onclick="clearDisplay()">C</button>
</div>
     
     <script>
       var MyMath = {
    num1: 0,
    num2: 0,
    operator: "",

    input: function(n1, n2, op) {
        this.num1 = n1;
        this.num2 = n2;
        this.operator = op;
    },

    calculate: function() {
        switch (this.operator) {
            case '+': return this.num1 + this.num2;
            case '-': return this.num1 - this.num2;
            case '*': return this.num1 * this.num2;
            case '/': return this.num2 === 0 ? "Error" : this.num1 / this.num2;
            default: return 0;
        }
    }
};

let current = "";
let operator = "";
let firstValue = "";

function press(num) {
    current += num;
    document.getElementById("display").value = current;
}

function setOp(op) {
    firstValue = current;
    operator = op;   // fixed
    current = "";
}

function calculate() {
    let secondValue = current;

    MyMath.input(
        parseFloat(firstValue),   // fixed
        parseFloat(secondValue),  // fixed
        operator
    );

    let result = MyMath.calculate();
    document.getElementById("display").value = result;
    current = result.toString();
}

function clearDisplay() {
    current = "";
    firstValue = "";
    operator = "";
    document.getElementById("display").value = "";
}
 function append(value) {
        document.getElementById("display").value += value;
    }

     </script>
</body>
</htm>
